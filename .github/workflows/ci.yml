name: CI

# Lo mismo que se exige en local antes de dar algo por terminado (CLAUDE.md):
# lint, tipos, pruebas unitarias y e2e del backend; lint, pruebas y build
# del frontend.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bns
          POSTGRES_PASSWORD: bns
          POSTGRES_DB: bns_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales solo de esta base efímera de CI (no son las de ningún
      # entorno). JWT_SECRET y SMTP_* ficticios los pone test/setup/env.ts.
      DATABASE_URL: postgresql://bns:bns@localhost:5432/bns_e2e_test
      TEST_DATABASE_URL: postgresql://bns:bns@localhost:5432/bns_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run test
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
